name: Deploy Node

# Continuously deploys derod to your node host(s).
#
# Inert by default: every job is gated on the DEPLOY_HOST secret, so this
# workflow does nothing until you configure the secrets below (repo
# Settings > Secrets and variables > Actions):
#
#   DEPLOY_HOST      - hostname/IP of the node (e.g. node.example.com)
#   DEPLOY_USER      - SSH user (must have sudo for systemctl restart)
#   DEPLOY_SSH_KEY   - private SSH key (ed25519) authorized on the host
#   DEPLOY_RPC_PORT  - daemon JSON-RPC port on the host (default 10102)
#   DEPLOY_ENABLED   - repository VARIABLE (Settings > Variables) set to
#                      'true' to actually run this workflow. The job is
#                      gated on it because secrets are not available in
#                      job-level conditions.
#
# The host is expected to run derod as a systemd unit named `derod` and to
# serve the daemon RPC on 127.0.0.1:$DEPLOY_RPC_PORT (SSH tunnel not
# required if the port is exposed; adjust the health check URL otherwise).
#
# Trigger on workflow_dispatch always; uncomment the push trigger only if
# you want continuous deployment from community-dev (the active dev branch
# releases are cut from).

on:
  workflow_dispatch:
  # push:
  #   branches: [community-dev]

permissions: read-all

env:
  GO_VERSION: "1.26"

jobs:
  deploy:
    name: 🚀 Deploy derod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Inert until DEPLOY_ENABLED=true is set (job-level conditions cannot
    # read secrets; the step below validates the secrets themselves).
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    permissions:
      contents: read
    steps:
      - name: 🔑 Verify deploy secrets are configured
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::DEPLOY_ENABLED=true but deploy secrets (DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY) are not configured. Set them in repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "✅ deploy secrets present"
      - name: 🛡️ Harden Runner
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit
      - name: 📥 Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: ⚙️ Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: 🔨 Build derod
        run: |
          go build -mod=vendor -trimpath -ldflags=-buildid= -o derod.new ./cmd/derod
          sha256sum derod.new
      - name: 🔑 Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: 📦 Upload binary
        run: |
          scp -o StrictHostKeyChecking=no derod.new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/derod.new"
      - name: 🔄 Swap binary and restart service
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sudo install -m 0755 /tmp/derod.new /usr/local/bin/derod && sudo systemctl restart derod"
      - name: 💓 Health check (RPC up + height advancing)
        env:
          RPC_PORT: ${{ secrets.DEPLOY_RPC_PORT }}
        run: |
          PORT="${RPC_PORT:-10102}"
          URL="http://${{ secrets.DEPLOY_HOST }}:${PORT}/json_rpc"
          # Wait for the daemon RPC to come back up (max ~90s)
          for i in $(seq 1 30); do
            if curl -sS --max-time 3 "$URL" \
              -d '{"jsonrpc":"2.0","id":"0","method":"get_info"}' \
              -H 'Content-Type: application/json' > /tmp/h1.json; then
              break
            fi
            sleep 3
          done
          jq -e '.result.height' /tmp/h1.json > /dev/null || {
            echo "❌ daemon RPC did not come back up"; exit 1; }
          H1=$(jq -r '.result.height' /tmp/h1.json)
          echo "✅ daemon up at height $H1"
          sleep 20
          curl -sS --max-time 5 "$URL" \
            -d '{"jsonrpc":"2.0","id":"0","method":"get_info"}' \
            -H 'Content-Type: application/json' > /tmp/h2.json
          H2=$(jq -r '.result.height' /tmp/h2.json)
          echo "height after 20s: $H2"
          if [ "$H2" -gt "$H1" ]; then
            echo "✅ chain advancing ($H1 -> $H2)"
          else
            echo "⚠️ height not advancing yet ($H1 -> $H2) - check peers; not failing"
          fi
